[package]
name = "manutech-height-annotator"
version = "0.64.0"
description = "ManuTech offline height annotation app"
authors = ["ManuTech"]
edition = "2021"

[lib]
name = "manutech_height_annotator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
log = "0.4"
